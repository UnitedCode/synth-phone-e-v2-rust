[package]
name = "audio-lab"
version = "0.1.0"
edition = "2021"
publish = false

# Independent of hardware-only firmware dependencies; pin checked by a regression test.
[workspace]

[dependencies]
synthphone-e-vocal-dsp = {git = "https://github.com/nathansbradshaw/synthphone_e_vocal_dsp.git", rev = "cddeddc84ad5b1d11a8c7e15f414f381186e633f"}
hound = "3.5"
libm = "0.2.15"
log = "=0.4.28"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
