[package]
authors = ["Nathan Bradshaw"]
edition = "2021"
name = "self-tests"
publish = false
version = "0.1.0"

[[test]]
name = "daisy"
harness = false

[dev-dependencies]
board = { path = "../board" }
cortex-m = "0.7.7"
defmt = "0.3.8"
defmt-rtt = "0.4.1"
defmt-test = "0.3.1"
panic-probe = { version = "0.3.2", features = ["print-defmt"] }

[features]
default = ['defmt-trace']
# these features are required by defmt
defmt-default = []
defmt-trace = []
defmt-debug = []
defmt-info = []
defmt-warn = []
defmt-error = []
