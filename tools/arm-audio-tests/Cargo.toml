[package]
name = "arm-audio-tests"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
synthphone-e-vocal-dsp = {git = "https://github.com/nathansbradshaw/synthphone_e_vocal_dsp.git", rev = "cddeddc84ad5b1d11a8c7e15f414f381186e633f"}
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"
cortex-m-semihosting = "0.5.0"
libm = "0.2.15"

[features]
omit-frame = []

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
debug = true
