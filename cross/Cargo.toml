[workspace]
members = [
  "app",
  "board",
  "self-tests",
]

[profile.dev]
codegen-units = 1 # better optimizations
debug = true # symbols are nice and they don't increase the size in flash
incremental = false
opt-level = "s" #
panic = "abort"

[profile.release]
codegen-units = 1
opt-level = "s"
lto = true
debug = true
panic = "abort"


[profile.test]
codegen-units = 1
incremental = false
lto = 'fat'
opt-level = 's'