[package]
name = "audio-lab"
version = "0.1.0"
edition = "2021"
publish = false

# Independent of hardware-only firmware dependencies; pin checked by a regression test.
[workspace]

[dependencies]
synthphone-e-vocal-dsp = {git = "https://github.com/nathansbradshaw/synthphone_e_vocal_dsp.git", rev = "d7148ad9dc6f285876bf11d31ddc4e4f268d646f"}
hound = "3.5"
libm = "0.2.15"
log = "=0.4.28"
midly = { version = "0.5.3", default-features = false, features = ["alloc"] }

[[example]]
name = "midi_reference"
test = true

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
