[package]
name = "audio-lab"
version = "0.1.0"
edition = "2021"
publish = false

# Independent of hardware-only firmware dependencies; pin checked by a regression test.
[workspace]

[dependencies]
synthphone-e-vocal-dsp = {git = "https://github.com/nathansbradshaw/synthphone_e_vocal_dsp.git", rev = "4cf708acb2c1744707a316c9fc37bf15b46d8f3e"}
hound = "3.5"
libm = "0.2.15"
log = "=0.4.28"
embedded-graphics = "=0.7.1"
heapless = "=0.8.0"
midly = { version = "0.5.3", default-features = false, features = ["alloc"] }

[dev-dependencies]
ssd1306 = "=0.7.1"
display-interface = "=0.4.1"

[[example]]
name = "midi_reference"
test = true

[[example]]
name = "harmony_isolation"
test = true

[[example]]
name = "formant_capture"
test = true

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
