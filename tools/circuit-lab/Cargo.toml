[package]
name = "circuit-workbench"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[features]
default = ["spice"]
spice = []
daisy = ["dep:virtual-daisy"]
device = ["daisy", "spice", "dep:hound", "dep:embedded-graphics"]

[dependencies]
virtual-daisy = { git = "https://github.com/UnitedCode/virtual-daisy", rev = "f7892c73b36960d729e6c3bf8bbd0ce3e65498a0", optional = true }
hound = { version = "3.5", optional = true }
embedded-graphics = { version = "0.7.1", optional = true }

[[bin]]
name = "circuit-workbench"
path = "src/main.rs"
