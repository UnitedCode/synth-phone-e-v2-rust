name: Virtual Daisy production firmware

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  virtual-daisy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: thumbv7em-none-eabihf
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/virtual-daisy/target
            audio-lab-results/daisy/native
            audio-lab-results/daisy/firmware-build
          key: virtual-daisy-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'tools/virtual-daisy/Cargo.lock') }}
      - name: Download pinned prebuilt emulator
        run: |
          curl -fL --retry 3 https://github.com/renode/renode/releases/download/v1.17.0/renode-1.17.0.linux-portable.tar.gz -o "$RUNNER_TEMP/renode.tar.gz"
          echo "4ba7c68b59e2447f188ef4b4b112fcccd2802582c460beedceb63b84e5605a5f  $RUNNER_TEMP/renode.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/renode"
          tar -xzf "$RUNNER_TEMP/renode.tar.gz" -C "$RUNNER_TEMP/renode" --strip-components=1
      - name: Format, lint, and peripheral/quality tests
        run: |
          cargo fmt --manifest-path tools/virtual-daisy/Cargo.toml -- --check
          cargo clippy --locked --manifest-path tools/virtual-daisy/Cargo.toml --target x86_64-unknown-linux-gnu --all-targets -- -D warnings
          cargo test --locked --manifest-path tools/virtual-daisy/Cargo.toml --target x86_64-unknown-linux-gnu
      - name: Boot production ELF, process audio, and reject injected faults
        run: cargo run --release --locked --manifest-path tools/virtual-daisy/Cargo.toml --target x86_64-unknown-linux-gnu -- run "$RUNNER_TEMP/renode" audio-lab-results/daisy
      - name: Publish audio measurements
        if: always()
        run: |
          if [ -f audio-lab-results/daisy/summary.txt ]; then
            cat audio-lab-results/daisy/summary.txt >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: virtual-daisy-audio
          if-no-files-found: ignore
          path: |
            audio-lab-results/daisy/*.txt
            audio-lab-results/daisy/*.sha256
            audio-lab-results/daisy/*.elf
            audio-lab-results/daisy/*.log
            audio-lab-results/daisy/*.rtt
            audio-lab-results/daisy/*.wav
            audio-lab-results/daisy/*.stats
            audio-lab-results/daisy/*.repl
