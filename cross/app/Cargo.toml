[package]
authors = ["Nathan Bradshaw", "Enoch Bradshaw"]
edition = "2021"
name = "app"
version = "0.1.0"

# makes `cargo check --all-targets` work
[[bin]]
name = "app"
bench = false
doctest = false
test = false

[dependencies]
cfg-if = "1.0.0"
cortex-m-rtic = "1.1.4"
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
# cortex-m-rt = "0.7.0"
panic-rtt-target = { version = "0.1.3"}
debouncr = "0.2.2"
log = "0.4.21"
panic-halt = "0.2.0"
stm32h7xx-hal = { version = "0.16.0", features = ["stm32h750v","rt","fmc", "xspi", "sdmmc", "sdmmc-fatfs", "usb_hs"] }
stm32-fmc = "0.3.0"
rtt-target = "0.5.0"
lazy_static = { version = "1.4.0", features = ["spin_no_std"] }
panic-itm = "0.4.2"
cortex-m-log =  { version = "0.8.0", features = ["itm", "semihosting", "log-integration"] }
micromath = "2.1.0"
microfft = "0.6"
libdaisy = {git = "https://github.com/nathansbradshaw/libdaisy-rust.git", features = ["log-rtt"], commit = "cff24384018e585e755f9949c25677d4b1f76c04"}
libm = "0.2.8"
heapless = "0.8.0"
autotune = {path = "../../autotune"}
state-machines = {path = "../../state-machines"}
ssd1306 = "0.7.1"
fugit = "0.3.7"
embedded-graphics = "0.7.1"
tinybmp = "0.4.0"

[features]
default = ['defmt-default']
# these features are required by defmt
defmt-default = []
defmt-trace = []
defmt-debug = []
defmt-info = []
defmt-warn = []
defmt-error = []
