name: Virtual Daisy production firmware

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  virtual-daisy:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        board: [rev4, rev5, rev7]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: thumbv7em-none-eabihf
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/virtual-daisy/target
            audio-lab-results/daisy/${{ matrix.board }}/native
            audio-lab-results/daisy/${{ matrix.board }}/firmware-build
            audio-lab-results/daisy/${{ matrix.board }}/cpu-core
          key: virtual-daisy-${{ runner.os }}-${{ matrix.board }}-${{ hashFiles('Cargo.lock', 'tools/virtual-daisy/Cargo.lock', 'tools/virtual-daisy/src/core.rs') }}
      - name: Download pinned prebuilt emulator
        run: |
          curl -fL --retry 3 https://github.com/renode/renode/releases/download/v1.17.0/renode-1.17.0.linux-portable.tar.gz -o "$RUNNER_TEMP/renode.tar.gz"
          echo "4ba7c68b59e2447f188ef4b4b112fcccd2802582c460beedceb63b84e5605a5f  $RUNNER_TEMP/renode.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/renode"
          tar -xzf "$RUNNER_TEMP/renode.tar.gz" -C "$RUNNER_TEMP/renode" --strip-components=1
      - name: Format, lint, and peripheral/quality tests
        run: |
          cargo fmt --manifest-path tools/virtual-daisy/Cargo.toml -- --check
          cargo clippy --locked --manifest-path tools/virtual-daisy/Cargo.toml --target x86_64-unknown-linux-gnu --all-targets -- -D warnings
          cargo test --locked --manifest-path tools/virtual-daisy/Cargo.toml --target x86_64-unknown-linux-gnu
      - name: Boot production ELF, process audio, and reject injected faults
        run: cargo run --release --locked --manifest-path tools/virtual-daisy/Cargo.toml --target x86_64-unknown-linux-gnu -- run "$RUNNER_TEMP/renode" "audio-lab-results/daisy/${{ matrix.board }}" --board "${{ matrix.board }}"
      - name: Check maximum-duration flash scenario on ARM
        if: matrix.board == 'rev5'
        env:
          VIRTUAL_DAISY_FLASH_MAXIMUM: 1
          VIRTUAL_DAISY_CORE_CACHE: ${{ github.workspace }}/audio-lab-results/daisy/rev5/cpu-core
        run: cargo run --release --locked --manifest-path tools/virtual-daisy/Cargo.toml --target x86_64-unknown-linux-gnu -- probe "$RUNNER_TEMP/renode" "audio-lab-results/daisy/rev5/maximum" --board rev5
      - name: Publish audio measurements
        if: always()
        run: |
          if [ -f "audio-lab-results/daisy/${{ matrix.board }}/summary.txt" ]; then
            cat "audio-lab-results/daisy/${{ matrix.board }}/summary.txt" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: virtual-daisy-${{ matrix.board }}
          if-no-files-found: ignore
          path: |
            audio-lab-results/daisy/${{ matrix.board }}/*.txt
            audio-lab-results/daisy/${{ matrix.board }}/*.sha256
            audio-lab-results/daisy/${{ matrix.board }}/*.elf
            audio-lab-results/daisy/${{ matrix.board }}/*.log
            audio-lab-results/daisy/${{ matrix.board }}/*.rtt
            audio-lab-results/daisy/${{ matrix.board }}/*.wav
            audio-lab-results/daisy/${{ matrix.board }}/*.stats
            audio-lab-results/daisy/${{ matrix.board }}/*.repl
            audio-lab-results/daisy/${{ matrix.board }}/architecture-probe.bin
            audio-lab-results/daisy/${{ matrix.board }}/*.architecture.bin
            audio-lab-results/daisy/${{ matrix.board }}/flash-probe.bin
            audio-lab-results/daisy/${{ matrix.board }}/*.flash.bin
            audio-lab-results/daisy/${{ matrix.board }}/timing-probe.bin
            audio-lab-results/daisy/${{ matrix.board }}/*.timing*.bin
            audio-lab-results/daisy/${{ matrix.board }}/interrupt-probe.bin
            audio-lab-results/daisy/${{ matrix.board }}/*.interrupt*.bin
            audio-lab-results/daisy/${{ matrix.board }}/maximum/*.txt
            audio-lab-results/daisy/${{ matrix.board }}/maximum/*.log
            audio-lab-results/daisy/${{ matrix.board }}/maximum/*.bin
